name: Deployment Branch Build

on:
  push:
    branches: [ deployment/cloud-run-neon ]
  pull_request:
    branches: [ deployment/cloud-run-neon ]

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, patient-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Package service
        working-directory: ${{ matrix.service }}
        run: mvn -B -DskipTests package
