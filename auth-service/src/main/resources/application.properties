spring.application.name=auth-service
server.port=4005

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=${JWT_SECRET:bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb25BbmRWYWxpZGF0aW9uMTIzNDU2Nzg5MA==}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}

# H2 remains available for local/test runs; production overrides these with PostgreSQL env vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user1234}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password1234}
