spring.application.name=auth-service
server.port=4005

# The auth schema must exist in PostgreSQL before the service starts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}

# SQL initialization is intentionally disabled; Hibernate manages the entity table.
spring.sql.init.mode=never

# Supply a strong Base64-encoded secret through the environment/Secret Manager.
# No insecure fallback is provided.
jwt.secret=${JWT_SECRET}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user1234}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
