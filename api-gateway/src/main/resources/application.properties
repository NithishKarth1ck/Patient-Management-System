server.port=${PORT:4004}

auth.service.url=${AUTH_SERVICE_URL:http://localhost:4005}

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[1]=https://patient-management-system-frontend-blue.vercel.app
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[1]=Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

spring.cloud.gateway.routes[0].id=auth-service-route
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:4005}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=patient-service-route
spring.cloud.gateway.routes[1].uri=${PATIENT_SERVICE_URL:http://localhost:4000}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/patients,/api/patients/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1]=JwtValidation

spring.cloud.gateway.routes[2].id=api-docs-patient-route
spring.cloud.gateway.routes[2].uri=${PATIENT_SERVICE_URL:http://localhost:4000}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api-docs/patients
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api-docs/patients,/v3/api-docs

spring.cloud.gateway.routes[3].id=api-docs-auth-route
spring.cloud.gateway.routes[3].uri=${AUTH_SERVICE_URL:http://localhost:4005}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api-docs/auth
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api-docs/auth,/v3/api-docs

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
